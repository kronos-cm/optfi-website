<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BriefPro — Chat v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #dde4ef; }

  .scroll::-webkit-scrollbar { width: 3px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 99px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.15); }

  /* Message entrance */
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes msgInUser {
    from { opacity: 0; transform: translateY(5px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg-in     { animation: msgIn 0.22s cubic-bezier(0.22,1,0.36,1) both; }
  .msg-in-usr { animation: msgInUser 0.18s cubic-bezier(0.22,1,0.36,1) both; }

  /* Typing dots */
  @keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-4px);opacity:1} }

  /* Hover-reveal timestamps */
  .msg-row .ts { opacity: 0; transition: opacity 0.15s; pointer-events: none; }
  .msg-row:hover .ts { opacity: 1; }

  /* Hover-reveal message actions */
  .msg-actions { opacity: 0; transition: opacity 0.12s; }
  .msg-row:hover .msg-actions { opacity: 1; }

  /* Send button spring */
  .send-btn { transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s, background 0.15s; }
  .send-btn:hover:not(:disabled) { transform: scale(1.08); }
  .send-btn:active:not(:disabled) { transform: scale(0.95); }

  /* Suggestion chip */
  .chip { transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .chip:hover { background: var(--chip-hover) !important; border-color: var(--chip-border-hover) !important; color: var(--chip-color-hover) !important; }

  /* Nav item hover */
  .nav-item { transition: background 0.12s, color 0.12s; }
  .nav-item:hover { background: rgba(0,82,147,0.05); }

  /* Change card action buttons */
  .action-btn { transition: background 0.12s, transform 0.1s; }
  .action-btn:hover { filter: brightness(0.95); }
  .action-btn:active { transform: scale(0.97); }

  /* Tab hover */
  .tab-btn { transition: color 0.12s, border-color 0.12s; }
  .tab-btn:hover { color: var(--tab-hover-color, #005293) !important; }
</style>
</head>
<body>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ─── TOKENS ─── */
const T = {
  light: {
    accent:       "#005293",
    accentLight:  "rgba(0,82,147,0.07)",
    accentMid:    "rgba(0,82,147,0.14)",
    bg:           "#ffffff",
    bgPage:       "#F5F7FA",
    bgPanel:      "#F8FAFC",
    bgRaised:     "#F1F5F9",
    bgHover:      "rgba(0,82,147,0.05)",
    border:       "rgba(0,0,0,0.06)",
    borderMed:    "rgba(0,0,0,0.09)",
    text1:        "#0F172A",
    text2:        "#526070",
    text3:        "#9EB3C6",
    green:        "#16A34A",
    greenBg:      "#F0FDF4",
    greenBorder:  "rgba(22,163,74,0.2)",
    red:          "#DC2626",
    redBg:        "#FEF2F2",
    amber:        "#B45309",
    amberBg:      "#FFFBEB",
    amberBorder:  "rgba(180,83,9,0.2)",
    /* messages */
    msgUser:      "#EAECF0",
    msgUserText:  "#0F172A",
    msgAiBg:      "transparent",
    msgAiText:    "#0F172A",
    /* input */
    inputBg:      "#FFFFFF",
    inputShadow:  "0 2px 16px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.06)",
    inputFocusShadow: "0 4px 24px rgba(0,82,147,0.12), 0 0 0 1.5px rgba(0,82,147,0.35)",
    /* panels */
    chatPanel:    "#FAFBFD",
    shadow:       "0 4px 24px rgba(0,0,0,0.07)",
    shadowMd:     "0 8px 40px rgba(0,0,0,0.1)",
  },
  dark: {
    accent:       "#3B82F6",
    accentLight:  "rgba(59,130,246,0.1)",
    accentMid:    "rgba(59,130,246,0.2)",
    bg:           "#0F1117",
    bgPage:       "#0F1117",
    bgPanel:      "#161B27",
    bgRaised:     "#1E2535",
    bgHover:      "rgba(59,130,246,0.06)",
    border:       "rgba(255,255,255,0.06)",
    borderMed:    "rgba(255,255,255,0.1)",
    text1:        "#EDF2F7",
    text2:        "#7A95B0",
    text3:        "#3D5468",
    green:        "#34D399",
    greenBg:      "rgba(52,211,153,0.08)",
    greenBorder:  "rgba(52,211,153,0.2)",
    red:          "#F87171",
    redBg:        "rgba(248,113,113,0.08)",
    amber:        "#FBBF24",
    amberBg:      "rgba(251,191,36,0.08)",
    amberBorder:  "rgba(251,191,36,0.2)",
    msgUser:      "#1E2535",
    msgUserText:  "#EDF2F7",
    msgAiBg:      "transparent",
    msgAiText:    "#EDF2F7",
    inputBg:      "#161B27",
    inputShadow:  "0 2px 16px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.06)",
    inputFocusShadow: "0 4px 24px rgba(59,130,246,0.15), 0 0 0 1.5px rgba(59,130,246,0.4)",
    chatPanel:    "#161B27",
    shadow:       "0 4px 24px rgba(0,0,0,0.25)",
    shadowMd:     "0 8px 40px rgba(0,0,0,0.35)",
  },
};

/* ─── ICONS ─── */
const IC = {
  send:     "M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z",
  mic:      ["M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z","M19 10v2a7 7 0 0 1-14 0v-2","M12 19v3","M8 22h8"],
  plus:     "M12 5v14M5 12h14",
  globe:    "M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z",
  chevL:    "M15 18l-6-6 6-6",
  chevR:    "M9 18l6-6-6-6",
  chevD:    "M6 9l6 6 6-6",
  chevU:    "M18 15l-6-6-6 6",
  refresh:  "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15",
  sparkles: ["M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09z","M18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456z"],
  copy:     ["M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z","M8 2h8l4 4v2H8z"],
  edit:     ["M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7","M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"],
  audit:    ["M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2","M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2","M9 12h6M9 16h4"],
  letter:   ["M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z","M22 6l-10 7L2 6"],
  plane:    "M12 19l9 2-9-18-9 18 9-2zm0 0v-8",
  check:    "M20 6L9 17l-5-5",
  x:        "M18 6L6 18M6 6l12 12",
  moon:     "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",
  sun:      ["M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42","M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"],
};

const Icon = ({ d, size=16, stroke=1.6, color="currentColor", fill="none" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d) ? d.map((p,i)=><path key={i} d={p}/>) : <path d={d}/>}
  </svg>
);

/* ─── DEMO DATA ─── */
const SUGGESTIONS = [
  { label: "Zusammenfassung schreiben", icon: IC.letter },
  { label: "Anamnese ergänzen",          icon: IC.edit },
  { label: "Diagnosen prüfen",           icon: IC.audit },
];
const DEMO_MSGS = [
  { id:"1", role:"user",      text:"Bitte ergänze die Anamnese mit den Vorerkrankungen.", time:"14:32" },
  { id:"2", role:"assistant", text:"Ich habe eine Ergänzung für die Anamnese vorgeschlagen:", time:"14:32", hasChange:true },
  { id:"3", role:"user",      text:"Genehmigen", time:"14:33" },
  { id:"4", role:"assistant", text:"✓ 1 Änderung angewendet. Die Anamnese wurde erfolgreich ergänzt.", time:"14:33", isConfirm:true },
];

/* ─── TYPING DOTS ─── */
function TypingDots({ t }) {
  return (
    <div style={{ display:"flex", gap:5, padding:"4px 2px", alignItems:"center", height:24 }}>
      {[0,1,2].map(i=>(
        <div key={i} style={{ width:5, height:5, borderRadius:"50%", background:t.text3, animation:`tdot 1.1s ease-in-out ${i*0.18}s infinite` }} />
      ))}
    </div>
  );
}

/* ─── AI AVATAR (small glyph) ─── */
function AiDot({ t, size=20 }) {
  return (
    <div style={{ width:size, height:size, borderRadius:"50%", flexShrink:0, background:t.accentLight, border:`1px solid ${t.accentMid}`, display:"flex", alignItems:"center", justifyContent:"center" }}>
      <Icon d={IC.sparkles} size={size*0.52} color={t.accent} stroke={1.7}/>
    </div>
  );
}

/* ─── CHANGE / DIFF CARD ─── */
function ChangeCard({ t }) {
  const [status, setStatus] = useState("pending");
  const isPending = status === "pending";
  return (
    <div style={{ borderRadius:10, background:t.bg, border:`1px solid ${t.borderMed}`, overflow:"hidden", fontSize:12.5, boxShadow:t.shadow }}>
      {/* Header row */}
      <div style={{ padding:"8px 12px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${t.border}` }}>
        <div style={{ display:"flex", alignItems:"center", gap:7 }}>
          <span style={{ fontSize:9.5, fontWeight:700, letterSpacing:"0.08em", color:t.accent, textTransform:"uppercase" }}>Ersetzen</span>
          <span style={{ width:1, height:10, background:t.border, display:"inline-block" }}/>
          <span style={{ fontWeight:600, color:t.text1, fontSize:12 }}>Anamnese</span>
        </div>
        <span style={{ fontSize:11, color:t.text3, fontWeight:500 }}>95 % sicher</span>
      </div>
      {/* Diff */}
      <div style={{ padding:"8px 10px", display:"flex", flexDirection:"column", gap:3 }}>
        <div style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
          <span style={{ fontSize:11, fontWeight:700, color:"#DC2626", marginTop:2, minWidth:10 }}>−</span>
          <div style={{ padding:"4px 8px", borderRadius:5, background:t.redBg, color:"#991B1B", fontFamily:"'JetBrains Mono',monospace", fontSize:11.5, lineHeight:1.6, flex:1 }}>Vorerkrankungen: keine bekannt</div>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"flex-start" }}>
          <span style={{ fontSize:11, fontWeight:700, color:t.green, marginTop:2, minWidth:10 }}>+</span>
          <div style={{ padding:"4px 8px", borderRadius:5, background:t.greenBg, color:"#166534", fontFamily:"'JetBrains Mono',monospace", fontSize:11.5, lineHeight:1.6, flex:1 }}>Vorerkrankungen: arterielle Hypertonie seit 2018, Diabetes mellitus Typ 2</div>
        </div>
      </div>
      {/* Actions */}
      {isPending ? (
        <div style={{ padding:"7px 10px 9px", display:"flex", gap:6, justifyContent:"flex-end" }}>
          <button className="action-btn" onClick={()=>setStatus("rejected")} style={{ padding:"5px 13px", fontWeight:500, borderRadius:7, border:`1px solid ${t.borderMed}`, background:t.bgRaised, color:t.text2, cursor:"pointer", fontSize:11.5 }}>Ablehnen</button>
          <button className="action-btn" onClick={()=>setStatus("approved")} style={{ padding:"5px 13px", fontWeight:600, borderRadius:7, border:"none", background:t.accent, color:"#fff", cursor:"pointer", fontSize:11.5 }}>Genehmigen</button>
        </div>
      ) : (
        <div style={{ padding:"7px 12px 9px", display:"flex", justifyContent:"flex-end", alignItems:"center", gap:5 }}>
          <Icon d={status==="approved"?IC.check:IC.x} size={13} color={status==="approved"?t.green:t.red} stroke={2.2}/>
          <span style={{ fontSize:11.5, fontWeight:600, color:status==="approved"?t.green:t.red }}>
            {status==="approved"?"Genehmigt":"Abgelehnt"}
          </span>
        </div>
      )}
    </div>
  );
}

/* ─── MESSAGE ─── */
function Message({ msg, t, isFirst, isLast }) {
  const isUser = msg.role === "user";
  return (
    <div className={`msg-row ${isUser?"msg-in-usr":"msg-in"}`} style={{ display:"flex", flexDirection:"column", alignItems:isUser?"flex-end":"flex-start", gap:0 }}>
      {/* Avatar row — only show AI avatar on first in group */}
      {!isUser && isFirst && (
        <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4, paddingLeft:2 }}>
          <AiDot t={t} size={18}/>
          <span className="ts" style={{ fontSize:10.5, color:t.text3, fontWeight:400, letterSpacing:"0.01em" }}>{msg.time}</span>
        </div>
      )}

      {/* Bubble row with hover actions */}
      <div style={{ display:"flex", alignItems:"flex-end", gap:8, flexDirection:isUser?"row-reverse":"row", maxWidth:"88%" }}>
        {/* Bubble */}
        {!msg.isConfirm && (
          <div style={{ padding:isUser?"9px 13px":"2px 0", borderRadius:isUser?"14px 14px 4px 14px":"0", background:isUser?t.msgUser:t.msgAiBg, color:isUser?t.msgUserText:t.msgAiText, fontSize:13.5, lineHeight:1.6, fontWeight:400, letterSpacing:"-0.01em", wordBreak:"break-word", textWrap:"pretty" }}>
            {msg.text}
          </div>
        )}
        {msg.isConfirm && (
          <div style={{ padding:"8px 12px", borderRadius:"14px 14px 14px 4px", background:t.greenBg, border:`1px solid ${t.greenBorder}`, color:t.green, fontSize:13, lineHeight:1.6, fontWeight:500 }}>
            {msg.text}
          </div>
        )}
        {/* Hover actions */}
        {!msg.isConfirm && (
          <div className="msg-actions" style={{ display:"flex", alignItems:"center", gap:3, paddingBottom:2 }}>
            <button title="Kopieren" style={{ background:"none", border:"none", cursor:"pointer", padding:3, borderRadius:4, color:t.text3, display:"flex" }}>
              <Icon d={IC.copy[0]} size={13} color={t.text3}/>
            </button>
          </div>
        )}
      </div>

      {/* Timestamp for user messages — hover reveal */}
      {isUser && isLast && (
        <span className="ts" style={{ fontSize:10.5, color:t.text3, marginTop:3, marginRight:2, letterSpacing:"0.01em" }}>{msg.time}</span>
      )}

      {/* Change card */}
      {msg.hasChange && (
        <div style={{ width:"100%", maxWidth:310, marginTop:6, paddingLeft:0 }}>
          <ChangeCard t={t}/>
        </div>
      )}
    </div>
  );
}

/* ─── EMPTY STATE ─── */
function EmptyState({ onSuggest, t }) {
  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"24px 20px 16px", gap:20 }}>
      {/* Icon */}
      <div style={{ position:"relative" }}>
        <div style={{ width:44, height:44, borderRadius:"50%", background:t.accentLight, border:`1.5px solid ${t.accentMid}`, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <Icon d={IC.sparkles} size={20} color={t.accent} stroke={1.6}/>
        </div>
        <div style={{ position:"absolute", bottom:1, right:1, width:10, height:10, borderRadius:"50%", background:t.green, border:`2px solid ${t.chatPanel}` }} />
      </div>
      {/* Copy */}
      <div style={{ textAlign:"center", lineHeight:1 }}>
        <div style={{ fontSize:13.5, fontWeight:600, color:t.text1, marginBottom:5 }}>Assistent bereit</div>
        <div style={{ fontSize:12.5, color:t.text2, lineHeight:1.65, maxWidth:200 }}>
          Womit kann ich bei{" "}
          <span style={{ color:t.accent, fontWeight:600 }}>Anna Schmidt</span>{" "}
          helfen?
        </div>
      </div>
      {/* Suggestions */}
      <div style={{ display:"flex", flexDirection:"column", gap:5, width:"100%", maxWidth:265 }}>
        {SUGGESTIONS.map(s=>(
          <button key={s.label} className="chip" onClick={()=>onSuggest(s.label)}
            style={{ "--chip-hover":t.accentLight, "--chip-border-hover":t.accentMid, "--chip-color-hover":t.accent, display:"flex", alignItems:"center", gap:10, padding:"9px 12px", background:t.bg, border:`1px solid ${t.border}`, borderRadius:9, cursor:"pointer", textAlign:"left", boxShadow:t.shadow }}>
            <div style={{ width:26, height:26, borderRadius:6, background:t.bgPanel, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
              <Icon d={s.icon} size={13} color={t.text2}/>
            </div>
            <span style={{ fontSize:12.5, fontWeight:500, color:t.text1, flex:1, lineHeight:1.35 }}>{s.label}</span>
            <Icon d={IC.chevR} size={12} color={t.text3}/>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ─── CHAT INPUT ─── */
function ChatInput({ value, onChange, onSend, disabled, hasMessages, t, compact }) {
  const ref = useRef();
  const [focused, setFocused] = useState(false);
  const [mic, setMic] = useState(false);

  useEffect(()=>{
    if(!ref.current) return;
    ref.current.style.height = "auto";
    ref.current.style.height = Math.min(ref.current.scrollHeight, 120) + "px";
  }, [value]);

  const hasText = value.trim().length > 0;

  return (
    <div style={{ padding: compact ? "6px 10px 14px" : "8px 14px 12px", background:"transparent", flexShrink:0 }}>
      {/* Floating input card */}
      <div style={{ borderRadius:14, background:t.inputBg, boxShadow:focused ? t.inputFocusShadow : t.inputShadow, transition:"box-shadow 0.2s", overflow:"hidden" }}>
        {/* Context chips — only before convo */}
        {!hasMessages && !compact && (
          <div style={{ padding:"8px 10px 0", display:"flex", gap:5, flexWrap:"wrap" }}>
            {SUGGESTIONS.map(s=>(
              <button key={s.label} className="chip" onClick={()=>onChange(s.label)}
                style={{ "--chip-hover":t.accentLight, "--chip-border-hover":"transparent", "--chip-color-hover":t.accent, padding:"4px 10px", fontSize:11.5, fontWeight:500, background:t.bgPanel, border:`1px solid ${t.border}`, borderRadius:999, color:t.text2, cursor:"pointer" }}>
                {s.label}
              </button>
            ))}
          </div>
        )}
        {/* Textarea */}
        <textarea ref={ref} value={value} onChange={e=>onChange(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); onSend(); } }}
          onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
          placeholder="Geben Sie Ihre Anfrage ein…"
          disabled={disabled} rows={1}
          style={{ width:"100%", resize:"none", border:"none", outline:"none", background:"transparent", color:t.text1, fontSize:13.5, lineHeight:1.6, padding:compact?"10px 12px 6px":"11px 13px 6px", fontFamily:"inherit", minHeight:40, maxHeight:120, overflowY:"auto", letterSpacing:"-0.01em" }}
        />
        {/* Toolbar */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 8px 8px 10px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:1 }}>
            {!compact && (
              <ToolBtn title="Anhang" t={t}><Icon d={IC.plus} size={14} color={t.text3}/></ToolBtn>
            )}
            <ToolBtn title="Mikrofon" active={mic} onClick={()=>setMic(v=>!v)} t={t}>
              <Icon d={IC.mic} size={14} color={mic?t.accent:t.text3}/>
            </ToolBtn>

/* ─── MESSAGE LIST RENDERER ─── */
function MessageList({ msgs, typing, msgRef, t }) {
  // Group consecutive messages by role
  const grouped = msgs.map((m, i) => ({
    ...m,
    isFirst: i === 0 || msgs[i-1].role !== m.role,
    isLast:  i === msgs.length-1 || msgs[i+1].role !== m.role,
  }));

  return (
    <div ref={msgRef} className="scroll" style={{ flex:1, overflowY:"auto", minHeight:0, background:t.chatPanel, display:"flex", flexDirection:"column" }}>
      {msgs.length === 0
        ? null
        : <div style={{ padding:"16px 14px 8px", display:"flex", flexDirection:"column", gap:10 }}>
            {grouped.map((m, i) => (
              <div key={m.id} style={{ marginTop: m.isFirst && i > 0 ? 6 : 0 }}>
                <Message msg={m} t={t} isFirst={m.isFirst} isLast={m.isLast}/>
              </div>
            ))}
            {typing && (
              <div style={{ display:"flex", alignItems:"center", gap:7 }} className="msg-in">
                <AiDot t={t} size={18}/>
                <TypingDots t={t}/>
              </div>
            )}
          </div>
      }
    </div>
  );
}

/* ─── STANDALONE CHAT PANEL ─── */
function ChatPanel({ withMessages=false, width=380, height=640, t }) {
  const [msgs, setMsgs] = useState(withMessages ? DEMO_MSGS : []);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const msgRef = useRef();

  useEffect(()=>{ if(msgRef.current) msgRef.current.scrollTop = msgRef.current.scrollHeight; }, [msgs, typing]);

  const send = () => {
    if(!input.trim()) return;
    const txt = input.trim(); setInput("");
    setMsgs(m=>[...m, { id:Date.now()+"", role:"user", text:txt, time:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) }]);
    setTyping(true);
    setTimeout(()=>{ setTyping(false); setMsgs(m=>[...m, { id:Date.now()+"", role:"assistant", text:"Ihre Anfrage wurde verarbeitet. Bitte prüfen Sie die vorgeschlagene Änderung.", time:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) }]); }, 1800);
  };

  return (
    <div style={{ width, height, display:"flex", flexDirection:"column", background:t.chatPanel, overflow:"hidden", border:`1px solid ${t.borderMed}`, boxShadow:t.shadowMd }}>
      <ChatHeader onCollapse={()=>{}} t={t}/>
      {msgs.length === 0
        ? <EmptyState onSuggest={txt=>setInput(txt)} t={t}/>
        : <MessageList msgs={msgs} typing={typing} msgRef={msgRef} t={t}/>
      }
      <ChatInput value={input} onChange={setInput} onSend={send} disabled={typing} hasMessages={msgs.length>0} t={t}/>
    </div>
  );
}

          <DCArtboard id="m-d-e" label="Dark · Expanded" width={390} height={844}>
            <MobileSheet expanded={true} t={tD}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel visible={tweaksVisible} tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
