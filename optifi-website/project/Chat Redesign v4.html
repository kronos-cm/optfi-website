<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BriefPro — Chat v4 Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #1C2333; }

/* ── Scrollbar ── */
.scroll::-webkit-scrollbar { width: 3px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px; }

/* ── Animations ── */
@keyframes msgIn    { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
@keyframes msgInUsr { from{opacity:0;transform:translateY(4px) scale(.985)} to{opacity:1;transform:none} }
.msg-ai  { animation: msgIn 0.22s cubic-bezier(0.22,1,0.36,1) both; }
.msg-usr { animation: msgInUsr 0.18s cubic-bezier(0.22,1,0.36,1) both; }
@keyframes tdot { 0%,60%,100%{transform:translateY(0);opacity:.25} 30%{transform:translateY(-4px);opacity:.9} }
@keyframes pulseRing {
  0%   { box-shadow: 0 0 0 0 rgba(59,143,212,0.5); }
  70%  { box-shadow: 0 0 0 7px rgba(59,143,212,0); }
  100% { box-shadow: 0 0 0 0 rgba(59,143,212,0); }
}
.ai-pulse { animation: pulseRing 1.4s ease-out infinite; }

/* ── Hover / interaction ── */
.msg-row .ts  { opacity:0; transition:opacity .15s; pointer-events:none; }
.msg-row:hover .ts { opacity:1; }
.send-btn { transition: transform .12s cubic-bezier(0.34,1.56,0.64,1), background .12s, box-shadow .12s; }
.send-btn:hover:not(:disabled) { transform:scale(1.1); }
.send-btn:active:not(:disabled) { transform:scale(.93); }
.apply-btn { transition: background .12s, transform .1s; }
.apply-btn:hover { background: rgba(59,143,212,.35) !important; transform:translateX(2px); }
.nav-itm { transition: background .12s, color .12s; }
.nav-itm:hover { background: rgba(255,255,255,.04) !important; }
.chip-btn { transition: background .13s, border-color .13s, color .13s; }
</style>
</head>
<body>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

/* ══════════════════════════════════════
   GLASS TOKENS
   ══════════════════════════════════════ */

/* Shared rim-light helper — top+left highlight only */
const rimLight = (extra="") =>
  `inset 0 1px 0 rgba(255,255,255,.10), inset 1px 0 0 rgba(255,255,255,.06)${extra ? ", " + extra : ""}`;

const G = {
  dark: {
    /* base */
    base:           "#09090B",
    /* panels — three transparency levels */
    navBg:          "rgba(18,18,21,0.82)",
    editorBg:       "rgba(14,14,17,0.94)",   /* most opaque — legibility */
    chatBg:         "rgba(20,20,24,0.72)",   /* lighter opacity — utility feel */
    leftNavBg:      "rgba(16,16,19,0.80)",
    inputBg:        "rgba(255,255,255,0.04)",
    raisedBg:       "rgba(255,255,255,0.05)",
    hoverBg:        "rgba(255,255,255,0.05)",
    /* borders — rim light only */
    rimLight:       rimLight(),
    border:         "rgba(255,255,255,0.07)",
    /* accent */
    blue:           "#3B8FD4",
    blueDark:       "#2970B8",
    blueGlass:      "rgba(59,143,212,0.18)",
    blueGlassBord:  "rgba(59,143,212,0.3)",
    /* text */
    text1:          "#E4E8F1",
    text2:          "#6B82A0",
    text3:          "#384D65",
    /* semantic */
    green:          "#34D399",
    greenBg:        "rgba(52,211,153,0.12)",
    greenBord:      "rgba(52,211,153,0.25)",
    red:            "#F87171",
    redBg:          "rgba(248,113,113,0.10)",
    amber:          "#FBBF24",
    amberBg:        "rgba(251,191,36,0.10)",
    amberBord:      "rgba(251,191,36,0.22)",
    /* messages */
    msgUser:        "rgba(59,143,212,0.18)",
    msgUserBord:    "rgba(59,143,212,0.28)",
    msgUserText:    "#C8DCEF",
    /* shadows — Z-axis separation */
    chatShadow:     "-12px 0 48px rgba(0,0,0,.55)",
    editorGlow:     "0 0 0 1px rgba(255,255,255,.04), 0 8px 32px rgba(0,0,0,.4)",
    cardShadow:     "0 4px 24px rgba(0,0,0,.35)",
    inputShadow:    rimLight("0 2px 12px rgba(0,0,0,.3)"),
    inputFocus:     rimLight("0 0 0 2px rgba(59,143,212,.45), 0 4px 20px rgba(59,143,212,.15)"),
    /* diff */
    monoRed:        "rgba(248,113,113,0.10)",
    monoGreen:      "rgba(52,211,153,0.10)",
    blur:           "blur(14px)",
  },
  light: {
    base:           "#DDE4EE",
    navBg:          "rgba(255,255,255,0.75)",
    editorBg:       "rgba(255,255,255,0.96)",
    chatBg:         "rgba(248,250,253,0.80)",
    leftNavBg:      "rgba(255,255,255,0.72)",
    inputBg:        "rgba(255,255,255,0.85)",
    raisedBg:       "rgba(0,0,0,0.03)",
    hoverBg:        "rgba(0,82,147,0.05)",
    rimLight:       "inset 0 1px 0 rgba(255,255,255,.9), inset 1px 0 0 rgba(255,255,255,.7)",
    border:         "rgba(0,0,0,0.07)",
    blue:           "#005293",
    blueDark:       "#003e6b",
    blueGlass:      "rgba(0,82,147,0.08)",
    blueGlassBord:  "rgba(0,82,147,0.2)",
    text1:          "#0F172A",
    text2:          "#526070",
    text3:          "#9EB3C6",
    green:          "#16A34A",
    greenBg:        "rgba(22,163,74,0.09)",
    greenBord:      "rgba(22,163,74,0.22)",
    red:            "#DC2626",
    redBg:          "rgba(220,38,38,0.07)",
    amber:          "#B45309",
    amberBg:        "rgba(180,83,9,0.09)",
    amberBord:      "rgba(180,83,9,0.2)",
    msgUser:        "#DDE5F0",
    msgUserBord:    "rgba(0,82,147,0.15)",
    msgUserText:    "#0F172A",
    chatShadow:     "-6px 0 32px rgba(0,82,147,.1)",
    editorGlow:     "0 0 0 1px rgba(0,0,0,.06), 0 4px 20px rgba(0,0,0,.08)",
    cardShadow:     "0 2px 12px rgba(0,0,0,.07)",
    inputShadow:    "0 2px 12px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.07)",
    inputFocus:     "0 4px 20px rgba(0,82,147,.14), 0 0 0 2px rgba(0,82,147,.28)",
    monoRed:        "rgba(220,38,38,0.07)",
    monoGreen:      "rgba(22,163,74,0.08)",
    blur:           "blur(14px)",
  },
};

/* glass panel style helper */
const glass = (g, which="chat", extra={}) => ({
  background: which==="editor" ? g.editorBg : which==="nav" ? g.navBg : which==="left" ? g.leftNavBg : g.chatBg,
  backdropFilter: g.blur,
  WebkitBackdropFilter: g.blur,
  boxShadow: (which==="editor" ? g.editorGlow : which==="chat" ? g.chatShadow : g.cardShadow) + `, ${g.rimLight}`.replace(", ,",","),
  border: `1px solid ${g.border}`,
  ...extra,
});

/* ══════════════════ ICONS ══════════════════ */
const IC = {
  send:      "M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z",
  mic:       ["M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z","M19 10v2a7 7 0 0 1-14 0v-2","M12 19v3","M8 22h8"],
  plus:      "M12 5v14M5 12h14",
  chevL:     "M15 18l-6-6 6-6",
  chevR:     "M9 18l6-6-6-6",
  chevD:     "M6 9l6 6 6-6",
  chevU:     "M18 15l-6-6-6 6",
  refresh:   "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15",
  sparkles:  ["M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09z","M18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456z"],
  check:     "M20 6L9 17l-5-5",
  x:         "M18 6L6 18M6 6l12 12",
  plane:     "M12 19l9 2-9-18-9 18 9-2zm0 0v-8",
  doc:       ["M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z","M14 2v6h6","M16 13H8M16 17H8M10 9H8"],
  letter:    ["M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z","M22 6l-10 7L2 6"],
  edit2:     ["M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7","M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"],
  clip:      ["M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2","M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2","M9 12h6M9 16h4"],
};
const Icon = ({d,size=16,stroke=1.6,color="currentColor",fill="none"}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">
    {Array.isArray(d)?d.map((p,i)=><path key={i} d={p}/>):<path d={d}/>}
  </svg>
);

/* ══════════════════ DATA ══════════════════ */
const QUICK = [
  {label:"Zusammenfassung", icon:IC.letter},
  {label:"Anamnese ergänzen", icon:IC.edit2},
  {label:"Diagnosen prüfen", icon:IC.clip},
];
const DEMO = [
  {id:"1",role:"user",      text:"Bitte ergänze die Anamnese mit den Vorerkrankungen.",time:"14:32"},
  {id:"2",role:"assistant", text:"Ich habe eine Ergänzung für die Anamnese identifiziert:",time:"14:32",hasChange:true,changeApproved:true},
  {id:"3",role:"user",      text:"Genehmigen",time:"14:33",isApproval:true},
  {id:"4",role:"assistant", text:"1 Änderung wurde erfolgreich übernommen.",time:"14:33",isConfirm:true},
];

/* ══════════════════ PRIMITIVES ══════════════════ */
function Dots({g}){
  return (
    <div style={{display:"flex",gap:5,alignItems:"center",height:20}}>
      {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:"50%",background:g.text3,animation:`tdot 1.1s ease-in-out ${i*0.18}s infinite`}}/>)}
    </div>
  );
}

function AiAvatar({g,size=20,pulsing=false}){
  return (
    <div className={pulsing?"ai-pulse":""} style={{width:size,height:size,borderRadius:"50%",flexShrink:0,background:g.blueGlass,border:`1px solid ${g.blueGlassBord}`,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <Icon d={IC.sparkles} size={size*.5} color={g.blue} stroke={1.7}/>
    </div>
  );
}

/* ══════════════════ CHANGE CARD ══════════════════ */
function ChangeCard({g, onApply, initialStatus="pending"}){
  const [st,setSt]=useState(initialStatus);
  const [expanded,setExpanded]=useState(false);
  return (
    <div style={{borderRadius:10,...glass(g,"chat"),boxShadow:g.cardShadow,overflow:"hidden",marginTop:7}}>
      {/* header */}
      <div style={{padding:"7px 11px",display:"flex",alignItems:"center",justifyContent:"space-between",background:g.raisedBg,borderBottom:`1px solid ${g.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <span style={{fontSize:9,fontWeight:700,letterSpacing:".08em",color:g.blue,background:g.blueGlass,padding:"2px 7px",borderRadius:4,border:`1px solid ${g.blueGlassBord}`}}>ERSETZEN</span>
          <span style={{fontSize:12,fontWeight:600,color:g.text1}}>Anamnese</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:11,fontWeight:700,color:g.blue}}>95 %</span>
          <button onClick={()=>setExpanded(v=>!v)} title={expanded?"Weniger anzeigen":"Mehr anzeigen"}
            style={{display:"flex",alignItems:"center",background:"none",border:"none",cursor:"pointer",padding:"3px",borderRadius:4,opacity:.6}}>
            <Icon d={expanded?IC.chevU:IC.chevD} size={13} color={g.text2}/>
          </button>
        </div>
      </div>
      {/* compact diff — always visible */}
      <div style={{padding:"8px 10px",display:"flex",flexDirection:"column",gap:3}}>
        {[
          {sign:"−",color:g.red,bg:g.monoRed,text:"Vorerkrankungen: keine bekannt"},
          {sign:"+",color:g.green,bg:g.monoGreen,text:"Vorerkrankungen: arterielle Hypertonie seit 2018, Diabetes mellitus Typ 2"},
        ].map(({sign,color,bg,text})=>(
          <div key={sign} style={{display:"flex",gap:7,alignItems:"flex-start"}}>
            <span style={{fontSize:11,fontWeight:800,color,lineHeight:"20px",userSelect:"none"}}>{sign}</span>
            <div style={{flex:1,padding:"4px 8px",borderRadius:5,background:bg,borderLeft:`2px solid ${color}44`,color:g.text1,fontFamily:"'JetBrains Mono','Courier New',monospace",fontSize:11,lineHeight:1.6}}>{text}</div>
          </div>
        ))}
      </div>
      {/* expanded detail */}
      {expanded && (
        <div style={{padding:"10px",display:"flex",flexDirection:"column",gap:9,borderTop:`1px solid ${g.border}`}}>
          <div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:".07em",color:g.text3,marginBottom:4}}>BESCHREIBUNG</div>
            <p style={{fontSize:12,fontWeight:600,color:g.text1,lineHeight:1.5}}>Vorerkrankungen in der Anamnese ergänzt.</p>
          </div>
          <div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:".07em",color:g.text3,marginBottom:4}}>BEGRÜNDUNG</div>
            <p style={{fontSize:11.5,color:g.text2,lineHeight:1.6}}>Die Patientenakte enthält dokumentierte Vorerkrankungen, die noch nicht im Entlassungsbrief erfasst waren. Die Ergänzung entspricht den klinischen Unterlagen.</p>
          </div>
        </div>
      )}
      {/* actions */}
      {st==="pending"?(
        <div style={{padding:"6px 10px 10px",display:"flex",gap:6,justifyContent:"space-between",alignItems:"center"}}>
          <button onClick={()=>setSt("rejected")} style={{padding:"5px 11px",fontWeight:500,borderRadius:7,border:`1px solid ${g.border}`,background:"transparent",color:g.text2,cursor:"pointer",fontSize:11.5}}>Ablehnen</button>
          <button className="apply-btn" onClick={()=>{setSt("approved");onApply&&onApply();}}
            style={{padding:"6px 14px",fontWeight:600,borderRadius:7,border:`1px solid ${g.blueGlassBord}`,background:g.blueGlass,color:g.blue,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",gap:5}}>
            <Icon d={IC.check} size={13} color={g.blue} stroke={2.5}/>
            In Brief übernehmen
          </button>
        </div>
      ):(
        <div style={{padding:"7px 12px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:22,height:22,borderRadius:"50%",background:g.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"#fff",flexShrink:0,letterSpacing:"-.02em"}}>DM</div>
            <span style={{fontSize:11,fontWeight:500,color:g.text2}}>Dr. Müller</span>
            <span style={{fontSize:10,color:g.text3,opacity:.5}}>·</span>
            <span style={{fontSize:11,color:g.text3}}>{new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <Icon d={st==="approved"?IC.check:IC.x} size={12} color={st==="approved"?g.green:g.red} stroke={2.5}/>
            <span style={{fontSize:11.5,fontWeight:600,color:st==="approved"?g.green:g.red}}>{st==="approved"?"Angewendet":"Abgelehnt"}</span>
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════ AUDIT BAR ══════════════════ */
const AUDIT_ENTRIES = [
  {id:"a1", op:"ERSETZEN", section:"Anamnese",  status:"approved", time:"14:32", doctor:"Dr. Müller"},
  {id:"a2", op:"ERGÄNZEN", section:"Diagnosen", status:"approved", time:"14:18", doctor:"Dr. Müller"},
];

function AuditBar({g}){
  const [open,setOpen]=useState(false);
  const count=AUDIT_ENTRIES.length;
  const last=AUDIT_ENTRIES[0];
  return (
    <div style={{margin:"8px 12px 2px",borderRadius:9,...glass(g,"chat"),boxShadow:g.cardShadow,overflow:"hidden",flexShrink:0,border:`1px solid ${open?g.blueGlassBord:g.border}`,transition:"border-color .15s"}}>
      {/* summary row */}
      <div style={{display:"flex",alignItems:"center",cursor:"pointer"}} onClick={()=>setOpen(v=>!v)}>
        <div style={{padding:"7px 10px",display:"flex",alignItems:"center",gap:7,flex:1}}>
          <Icon d={open?IC.chevD:IC.chevR} size={11} color={g.text3}/>
          <span style={{fontSize:11.5,fontWeight:700,color:g.text1}}>Audit</span>
          <span style={{fontSize:10,fontWeight:700,padding:"1px 6px",borderRadius:999,background:g.blue,color:"#fff"}}>{count}</span>
          <span style={{fontSize:11,color:g.text3}}>Genehmigt · 14.07., {last.time}</span>
        </div>
        <button onClick={e=>{e.stopPropagation();}} title="Aktualisieren"
          style={{padding:"7px 10px",background:"none",border:"none",cursor:"pointer",display:"flex",opacity:.45}}>
          <Icon d={IC.refresh} size={12} color={g.text2}/>
        </button>
      </div>
      {/* expanded entries */}
      {open && AUDIT_ENTRIES.map((e,i)=>(
        <div key={e.id}
          title={`${e.op} · ${e.section} — zur Nachricht springen`}
          style={{display:"flex",alignItems:"center",gap:8,padding:"6px 12px",cursor:"pointer",borderTop:`1px solid ${g.border}`,transition:"background .12s"}}
          onMouseEnter={ev=>ev.currentTarget.style.background=g.hoverBg}
          onMouseLeave={ev=>ev.currentTarget.style.background="transparent"}>
          <span style={{fontSize:8.5,fontWeight:700,letterSpacing:".06em",color:g.blue,background:g.blueGlass,border:`1px solid ${g.blueGlassBord}`,padding:"1px 5px",borderRadius:3,flexShrink:0}}>{e.op}</span>
          <span style={{fontSize:11.5,fontWeight:600,color:g.text1,flex:1}}>{e.section}</span>
          <Icon d={IC.check} size={11} color={g.green} stroke={2.5}/>
          <span style={{fontSize:11,color:g.green,fontWeight:600}}>Genehmigt</span>
          <span style={{fontSize:10.5,color:g.text3}}>{e.time}</span>
          <div style={{width:16,height:16,borderRadius:"50%",background:g.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,fontWeight:700,color:"#fff",flexShrink:0}}>DM</div>
        </div>
      ))}
    </div>
  );
}

/* ══════════════════ MESSAGE ══════════════════ */
function Msg({msg,g,isFirst}){
  const isUser=msg.role==="user";
  return (
    <div className={`msg-row ${isUser?"msg-usr":"msg-ai"}`} style={{display:"flex",flexDirection:"column",alignItems:isUser?"flex-end":"flex-start"}}>
      {!isUser && isFirst && (
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
          <AiAvatar g={g} size={17}/>
          <span className="ts" style={{fontSize:10,color:g.text3}}>{msg.time}</span>
        </div>
      )}
      {!msg.isConfirm&&(
        <div style={{maxWidth:"88%"}}>
      {isUser && msg.isApproval && (
            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4,justifyContent:"flex-end"}}>
              <div style={{width:18,height:18,borderRadius:"50%",background:g.blue,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700,color:"#fff",flexShrink:0}}>DM</div>
              <span style={{fontSize:10.5,color:g.text2,fontWeight:500}}>Dr. Müller</span>
              <span style={{fontSize:10,color:g.text3}}>·</span>
              <span style={{fontSize:10.5,color:g.text3}}>{msg.time}</span>
            </div>
          )}
          <div style={{padding:isUser?"9px 13px":"1px 0",borderRadius:isUser?"13px 13px 4px 13px":"0",background:isUser?g.msgUser:"transparent",border:isUser?`1px solid ${g.msgUserBord}`:"none",color:isUser?g.msgUserText:g.text1,fontSize:13.5,lineHeight:1.65,letterSpacing:"-.01em",wordBreak:"break-word"}}>
            {msg.text}
          </div>
        </div>
      )}

/* ══════════════════ INPUT ══════════════════ */
function ChatInput({value,onChange,onSend,disabled,hasMessages,g,compact}){
  const ref=useRef();
  const [focused,setFocused]=useState(false);
  const [mic,setMic]=useState(false);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.style.height="auto";
    ref.current.style.height=Math.min(ref.current.scrollHeight,108)+"px";
  },[value]);
  const hasText=value.trim().length>0;
  return (
    <div style={{padding:compact?"6px 10px 14px":"6px 12px 14px",background:"transparent",flexShrink:0}}>
      <div style={{borderRadius:13,...glass(g,"chat"),boxShadow:focused?g.inputFocus:g.inputShadow,transition:"box-shadow .18s",overflow:"hidden"}}>
        {/* Quick action chips removed — empty state buttons serve this purpose */}
        <textarea ref={ref} value={value} onChange={e=>onChange(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();onSend();}}}
          onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
          placeholder="Anfrage eingeben…" disabled={disabled} rows={1}
          style={{width:"100%",resize:"none",border:"none",outline:"none",background:"transparent",color:g.text1,fontSize:13.5,lineHeight:1.6,padding:compact?"10px 12px 5px":"11px 13px 5px",fontFamily:"inherit",minHeight:40,maxHeight:108,overflowY:"auto",letterSpacing:"-.01em","::placeholder":{color:g.text3}}}
        />
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 8px 8px 10px"}}>
          <div style={{display:"flex",alignItems:"center",gap:2}}>
            <button onClick={()=>setMic(v=>!v)} style={{padding:"5px 6px",background:mic?g.blueGlass:"transparent",border:"none",borderRadius:6,cursor:"pointer",display:"flex"}}>
              <Icon d={IC.mic} size={14} color={mic?g.blue:g.text3}/>
            </button>
            {!compact&&<button style={{padding:"5px 6px",background:"transparent",border:"none",borderRadius:6,cursor:"pointer",display:"flex"}}>
              <Icon d={IC.plus} size={14} color={g.text3}/>
            </button>}
            <span style={{fontSize:9.5,fontWeight:700,padding:"2px 7px",background:g.raisedBg,borderRadius:999,color:g.text3,letterSpacing:".04em",marginLeft:4}}>BriefPro-1</span>
          </div>
          <button className="send-btn" onClick={onSend} disabled={!hasText||disabled}

            <Icon d={IC.send} size={13} color={hasText?"#fff":g.text3} stroke={2.2}/>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════ STANDALONE PANEL ══════════════════ */
function ChatPanel({withMessages=false,width=380,height=640,g}){
  const [msgs,setMsgs]=useState(withMessages?DEMO:[]);
  const [input,setInput]=useState("");
  const [typing,setTyping]=useState(false);
  const msgRef=useRef();
  useEffect(()=>{ if(msgRef.current) msgRef.current.scrollTop=msgRef.current.scrollHeight; },[msgs,typing]);
  const send=()=>{
    if(!input.trim()) return;
    const txt=input.trim(); setInput("");
    setMsgs(m=>[...m,{id:Date.now()+"",role:"user",text:txt,time:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}]);
    setTyping(true);
    setTimeout(()=>{ setTyping(false); setMsgs(m=>[...m,{id:Date.now()+"",role:"assistant",text:"Ihre Anfrage wurde verarbeitet.",time:new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}]); },1800);
  };
  return (
    <div style={{width,height,display:"flex",flexDirection:"column",overflow:"hidden",...glass(g,"chat"),borderRadius:12}}>
      <ChatHeader onCollapse={()=>{}} g={g}/>
      <CtxBadge g={g}/>

      {msgs.length===0?<Empty onSuggest={txt=>setInput(txt)} g={g}/>:<Feed msgs={msgs} typing={typing} msgRef={msgRef} g={g}/>}
      <ChatInput value={input} onChange={setInput} onSend={send} disabled={typing} hasMessages={msgs.length>0} g={g}/>
    </div>
  );
}

            <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke={g.text3} strokeWidth={2} strokeLinecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span style={{fontSize:12,color:g.text3}}>Patient suchen…</span>
          </div>
          <button style={{padding:"5px 12px",fontSize:12,fontWeight:600,background:"transparent",border:`1px solid ${g.border}`,borderRadius:7,color:g.text2,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}>
            <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke={g.text2} strokeWidth={2.2} strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Neuer Patient
          </button>
          <button onClick={()=>setAktionenOpen(v=>!v)}
            style={{padding:"5px 13px",fontSize:12,fontWeight:600,background:"transparent",border:`1px solid ${aktionenOpen?g.blue:g.border}`,borderRadius:7,color:aktionenOpen?g.blue:g.text2,cursor:"pointer",display:"flex",alignItems:"center",gap:5,transition:"border-color .15s, color .15s"}}>
            <svg width={14} height={14} viewBox="0 0 24 24" fill={aktionenOpen?g.blue:g.text2} stroke="none"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
            Aktionen
          </button>
        </div>
      </div>

      {/* ── Aktionen dropdown (portal-like, absolute inside root) ── */}
      <AktionenDropdown g={g} open={aktionenOpen} onClose={()=>setAktionenOpen(false)}/>

      {/* ── Body ── */}
      <div style={{flex:1,display:"flex",gap:GAP,minHeight:0}}>

        {/* Left nav */}
        <div style={{width:NAV_W,flexShrink:0,...glass(g,"left"),borderRadius:10,display:"flex",flexDirection:"column",overflow:"hidden",transition:"width .24s cubic-bezier(.4,0,.2,1)"}}>
          {/* Logo area with hamburger placeholder for visual alignment */}
          <div style={{height:38,display:"flex",alignItems:"center",justifyContent:navCollapsed?"center":"flex-start",padding:navCollapsed?"0":"0 14px",borderBottom:`1px solid ${g.border}`,flexShrink:0}}>
            {navCollapsed
              ? <AiAvatar g={g} size={18}/>
              : <span style={{fontSize:11,fontWeight:700,letterSpacing:".05em",color:g.text3,textTransform:"uppercase"}}>Navigation</span>
            }
          </div>
          {/* Nav items */}
          <div style={{flex:1,padding:"6px 0"}}>
            {NAV_ITEMS.map(({label,icon},i)=>(
              <div key={label} className="nav-itm" title={navCollapsed?label:undefined}
                style={{padding:navCollapsed?"9px 0":"7px 14px",fontSize:11.5,fontWeight:i===1?600:400,color:i===1?g.blue:g.text2,cursor:"pointer",borderRight:`2px solid ${i===1?g.blue:"transparent"}`,display:"flex",alignItems:"center",gap:9,justifyContent:navCollapsed?"center":"flex-start",overflow:"hidden",whiteSpace:"nowrap"}}>
                <Icon d={icon} size={14} color={i===1?g.blue:g.text2} stroke={i===1?2:1.5}/>
                {!navCollapsed && label}
              </div>
            ))}
          </div>
        </div>

        {/* Editor */}
        <div style={{flex:1,...glass(g,"editor"),borderRadius:10,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>

          {/* Completeness bar — always visible, above tabs */}
          <div style={{padding:"8px 14px 7px",display:"flex",alignItems:"center",gap:10,borderBottom:`1px solid ${g.border}`,flexShrink:0}}>
            {/* Ring */}
            <div style={{width:32,height:32,borderRadius:"50%",border:`2.5px solid ${g.green}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:g.green,flexShrink:0}}>100%</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:7}}>
                <span style={{fontSize:12.5,fontWeight:600,color:g.text1,letterSpacing:"-.01em"}}>Vollständigkeit</span>
                <span style={{fontSize:9.5,fontWeight:700,padding:"2px 8px",borderRadius:999,background:g.greenBg,color:g.green,border:`1px solid ${g.greenBord}`}}>✓ Bereit für Review</span>
              </div>
              <div style={{fontSize:10.5,color:g.text3,marginTop:1}}>Arztbrief ist vollständig.</div>
            </div>
            <button style={{padding:"6px 14px",fontSize:12,fontWeight:700,background:g.blue,color:"#fff",border:"none",borderRadius:7,cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
              <Icon d={IC.plane} size={12} color="#fff" stroke={2.2}/>
              Zur Freigabe
            </button>
          </div>

          {/* Tab bar */}
          <div style={{display:"flex",alignItems:"center",padding:"0 10px",flexShrink:0,height:38}}>
            <button style={{padding:"5px 11px",fontSize:11.5,fontWeight:700,background:g.blue,color:"#fff",border:"none",borderRadius:5,marginRight:6,cursor:"pointer",flexShrink:0}}>Full Letter</button>
            {TABS.map(tab=>{
              const key=tab.toLowerCase();
              const act=activeTab===key;
              return (
                <button key={tab} onClick={()=>setActiveTab(key)}
                  style={{padding:"5px 10px",fontSize:11,fontWeight:act?600:400,background:"transparent",border:"none",borderBottom:`2px solid ${act?g.blue:"transparent"}`,color:act?g.blue:g.text2,cursor:"pointer",whiteSpace:"nowrap",transition:"color .12s, border-color .12s",flexShrink:0}}>
                  {tab}
                </button>
              );
            })}
          </div>
          <div style={{height:1,background:g.border,margin:"0 12px",flexShrink:0}}/>

          {/* Letter content */}
          <div className="scroll" style={{flex:1,overflowY:"auto",padding:"28px 44px"}}>
            <h2 style={{fontSize:19,fontWeight:700,color:g.blue,marginBottom:14,letterSpacing:"-.03em"}}>Einleitung</h2>
            <p style={{fontSize:14,fontWeight:600,color:g.text1,marginBottom:9,letterSpacing:"-.01em"}}>Vorläufiger Entlassungsbrief</p>
            <p style={{fontSize:14,color:g.text2,marginBottom:9,lineHeight:1.75}}>Bernau bei Berlin, 14.07.2025</p>
            <p style={{fontSize:14,color:g.text2,marginBottom:26,lineHeight:1.8}}>wir berichten über Frau Anna Schmidt, geboren am 15.03.1985, wohnhaft in Bernau bei Berlin, welche sich vom 10.07.2025 bis 14.07.2025 zur Behandlung einer arteriellen Hypertonie in unserer stationären Behandlung befand.</p>
            <div style={{height:1,background:g.border,margin:"0 0 26px"}}/>
            <h2 style={{fontSize:19,fontWeight:700,color:g.blue,marginBottom:12,letterSpacing:"-.03em"}}>Risikofaktoren</h2>
            {["– Familiäre Vorbelastung: Vater herzkrank","– Beruflicher Stress als Grundschullehrerin","– Kein Anhalt für weitere kardiovaskuläre Risikofaktoren"].map((tx,i)=>(
              <p key={i} style={{fontSize:14,color:g.text2,marginBottom:9,lineHeight:1.7}}>{tx}</p>
            ))}
            <div style={{height:1,background:g.border,margin:"24px 0"}}/>
            <h2 style={{fontSize:19,fontWeight:700,color:g.blue,marginBottom:12,letterSpacing:"-.03em"}}>Diagnosen</h2>
            {["– Arterielle Hypertonie (I10)","– Verdacht auf Schlafapnoe-Syndrom (G47.3)"].map((tx,i)=>(
              <p key={i} style={{fontSize:14,color:g.text2,marginBottom:9,lineHeight:1.7}}>{tx}</p>
            ))}
          </div>
        </div>

        {/* Chat */}
        <div style={{width:CHAT_W,flexShrink:0,...glass(g,"chat"),borderRadius:10,display:"flex",flexDirection:"column",overflow:"hidden",minHeight:0,transition:"width .26s cubic-bezier(.4,0,.2,1)",position:"relative",zIndex:2,boxShadow:g.chatShadow}}>
          {collapsed?(
            <div style={{width:40,display:"flex",flexDirection:"column",alignItems:"center",paddingTop:12,gap:12}}>
              <button onClick={()=>setCollapsed(false)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
                <Icon d={IC.chevL} size={12} color={g.text3}/>
                <AiAvatar g={g} size={19}/>
              </button>
            </div>
          ):(
            <>
              <ChatHeader onCollapse={()=>setCollapsed(true)} g={g}/>
              <CtxBadge g={g}/>
              <AuditBar g={g}/>
              {msgs.length===0?<Empty onSuggest={txt=>setInput(txt)} g={g}/>:<Feed msgs={msgs} typing={typing} msgRef={msgRef} g={g}/>}
              <ChatInput value={input} onChange={setInput} onSend={send} disabled={typing} hasMessages={msgs.length>0} g={g}/>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════ TWEAKS ══════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"theme":"dark"}/*EDITMODE-END*/;

function TweaksPanel({visible,tweaks,setTweaks}){
  if(!visible) return null;
  return (
    <div style={{position:"fixed",bottom:24,right:24,background:"rgba(20,20,24,0.9)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",border:"1px solid rgba(255,255,255,.1)",borderRadius:12,padding:16,width:200,zIndex:1000,boxShadow:"0 8px 32px rgba(0,0,0,.4)",fontFamily:"Inter,sans-serif",color:"#E4E8F1"}}>
      <div style={{fontSize:12.5,fontWeight:700,marginBottom:12}}>Tweaks</div>
      <label style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,color:"#6B82A0",cursor:"pointer"}}>
        Dark mode
        <input type="checkbox" checked={tweaks.theme==="dark"} onChange={e=>setTweaks(v=>({...v,theme:e.target.checked?"dark":"light"}))}/>
      </label>
    </div>
  );
}

/* ══════════════════ ROOT ══════════════════ */
function App(){
  const [tweaks,setTweaks]=useState(TWEAK_DEFAULTS);
  const [tweaksVisible,setTweaksVisible]=useState(false);
  useEffect(()=>{
    window.addEventListener("message",e=>{
      if(e.data?.type==="__activate_edit_mode")   setTweaksVisible(true);
      if(e.data?.type==="__deactivate_edit_mode") setTweaksVisible(false);
    });
    window.parent.postMessage({type:"__edit_mode_available"},"*");
  },[]);
  const gD=G.dark, gL=G.light;

  return (
    <>
      <DesignCanvas>
        <DCSection id="dark-panel" title="Dark Glass — Chat Panel">
          <DCArtboard id="dp-empty" label="Empty State" width={380} height={640}>
            <div style={{width:380,height:640,background:gD.base,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <ChatPanel withMessages={false} width={356} height={616} g={gD}/>
            </div>
          </DCArtboard>
          <DCArtboard id="dp-msgs" label="With Messages" width={380} height={640}>
            <div style={{width:380,height:640,background:gD.base,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <ChatPanel withMessages={true} width={356} height={616} g={gD}/>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="dark-int" title="Dark Glass — Integrated">
          <DCArtboard id="di-open" label="Chat Open" width={1200} height={720}>
            <IntegratedView chatCollapsed={false} g={gD}/>
          </DCArtboard>
          <DCArtboard id="di-col" label="Chat Collapsed" width={1200} height={720}>
            <IntegratedView chatCollapsed={true} g={gD}/>
          </DCArtboard>
        </DCSection>

        <DCSection id="light-panel" title="Light Glass — Chat Panel">
          <DCArtboard id="lp-empty" label="Empty State" width={380} height={640}>
            <div style={{width:380,height:640,background:gL.base,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <ChatPanel withMessages={false} width={356} height={616} g={gL}/>
            </div>
          </DCArtboard>
          <DCArtboard id="lp-msgs" label="With Messages" width={380} height={640}>
            <div style={{width:380,height:640,background:gL.base,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <ChatPanel withMessages={true} width={356} height={616} g={gL}/>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection id="light-int" title="Light Glass — Integrated">
          <DCArtboard id="li-open" label="Chat Open" width={1200} height={720}>
            <IntegratedView chatCollapsed={false} g={gL}/>
          </DCArtboard>
          <DCArtboard id="li-col" label="Chat Collapsed" width={1200} height={720}>
            <IntegratedView chatCollapsed={true} g={gL}/>
          </DCArtboard>
        </DCSection>

        <DCSection id="mob" title="Mobile Glass">
          <DCArtboard id="md-c" label="Dark · Collapsed" width={390} height={844}>
            <MobileSheet expanded={false} g={gD}/>
          </DCArtboard>
          <DCArtboard id="md-e" label="Dark · Expanded" width={390} height={844}>
            <MobileSheet expanded={true} g={gD}/>
          </DCArtboard>
          <DCArtboard id="ml-c" label="Light · Collapsed" width={390} height={844}>
            <MobileSheet expanded={false} g={gL}/>
          </DCArtboard>
          <DCArtboard id="ml-e" label="Light · Expanded" width={390} height={844}>
            <MobileSheet expanded={true} g={gL}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel visible={tweaksVisible} tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
